<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#26262b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c9cff"/>
      <stop offset="1" stop-color="#3b6fe8"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <!-- sidebar -->
    <rect x="100" y="100" width="262" height="824" fill="url(#side)"/>
    <rect x="361" y="100" width="2" height="824" fill="#000" opacity="0.45"/>
    <rect x="363" y="100" width="1" height="824" fill="#fff" opacity="0.06"/>

    <!-- sidebar rows: terminal entries -->
    <g fill="#9a9aa3">
      <rect x="160" y="292" width="140" height="26" rx="13" opacity="0.55"/>
      <rect x="160" y="402" width="104" height="26" rx="13" opacity="0.55"/>
      <rect x="160" y="512" width="126" height="26" rx="13" opacity="0.55"/>
    </g>
    <!-- selected row -->
    <rect x="128" y="376" width="206" height="78" rx="18" fill="#fff" opacity="0.07"/>
    <!-- attention dot -->
    <circle cx="300" cy="305" r="14" fill="url(#blue)"/>
    <circle cx="300" cy="305" r="14" fill="#6c9cff" opacity="0.6" filter="url(#glow)"/>

    <!-- top sheen -->
    <rect x="100" y="100" width="824" height="412" fill="url(#sheen)" opacity="0.05"/>
  </g>

  <!-- prompt chevron -->
  <path d="M470 330 L652 512 L470 694" fill="none" stroke="url(#blue)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block -->
  <rect x="712" y="620" width="112" height="74" rx="14" fill="url(#blue)"/>

  <!-- inner edge highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
